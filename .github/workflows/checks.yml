name: Source regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt av psutil pywin32 pefile pyinstaller
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Run complete isolated source checkpoint
        run: python scripts/check_project.py build/ci-source --jobs 3
      - name: Preserve logs and machine-readable results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-source-results
          path: |
            build/ci-source/*.json
            build/ci-source/*.log
          retention-days: 7
